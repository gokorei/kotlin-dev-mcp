name: Kotlin MCP Server CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Set up Java 25 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build and Dump Tooling Classpaths
        run: ./gradlew dumpToolingClasspaths syncKotlinDocs processStdlibIndex

      - name: Run Test Suite
        run: ./gradlew test --stacktrace

      - name: Build Distribution Jar
        run: ./gradlew uberJar --no-daemon
