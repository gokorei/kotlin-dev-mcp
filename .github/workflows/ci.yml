name: Kotlin MCP Server CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Set up Java 25 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # Persist the Gradle build cache so unchanged task outputs (compiled
      # classes, tooling classpaths, generated stdlib index) are restored
      # instead of rebuilt from scratch on every push. Tasks are keyed by
      # their real inputs, so changed sources simply miss and recompile.
      - name: Restore Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-build-cache-

      - name: Build and Test
        run: ./gradlew test uberJar
