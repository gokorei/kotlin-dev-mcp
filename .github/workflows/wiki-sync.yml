name: Auto-Sync Wiki Documentation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/wiki/**'
  workflow_dispatch:

jobs:
  sync-wiki:
    name: Sync docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5

      - name: Checkout Wiki Repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          token: ${{ secrets.GITHUB_TOKEN }}
          path: wiki-repo
        continue-on-error: true

      - name: Sync Markdown Pages & Push to Wiki
        run: |
          # Guard on a real git checkout: when the wiki repo has not been
          # initialized yet, actions/checkout fails (continue-on-error) but
          # leaves an empty wiki-repo/ directory, so test for .git explicitly.
          if [ -d "wiki-repo/.git" ]; then
            cp -R docs/wiki/* wiki-repo/
            cd wiki-repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if git status --porcelain | grep -q .; then
              git commit -m "docs: auto-update wiki pages from codebase"
              git push
              echo "Wiki successfully updated."
            else
              echo "No wiki changes detected."
            fi
          else
            echo "Wiki repository not initialized yet. Create the first page at https://github.com/${{ github.repository }}/wiki to initialize it."
          fi
