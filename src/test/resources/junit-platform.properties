# Fail any test that exceeds this bound instead of hanging the whole suite.
# Catches leaked-thread / live-network stalls that otherwise block the test
# JVM indefinitely (test task also passes -Dkmcp.disable_network_audits=true
# so OSV/network calls fall back to the offline baseline).
junit.jupiter.execution.timeout.testable.method.default=5m
junit.jupiter.execution.timeout.testable.template.default=5m